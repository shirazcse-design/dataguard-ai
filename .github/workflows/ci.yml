name: CI

on:
  push:
    branches: [main, "uc4/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,otel]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest

  config-validation:
    name: Validate taxonomy / high-risk / eval config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: dataguard-uc4 config validate

  dataset-validation:
    name: Regenerate + validate synthetic dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Regenerates from spec + seed and requires byte-identical output plus clean integrity checks.
      - run: dataguard-uc4 dataset validate

  harness-validation:
    name: Validate the evaluation harness (oracle / majority / random)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Exits non-zero if any of the harness self-checks fails.
      - run: dataguard-uc4 eval validate-harness --out-dir "$RUNNER_TEMP/harness-validation"

  rules-baseline:
    name: Rules Engine dev evaluation + baseline report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Development splits only: the locked test split is refused without --allow-locked-test.
      - run: dataguard-uc4 eval run --classifier rules --split all --runs-dir "$RUNNER_TEMP/runs"
      - run: dataguard-uc4 rules report --out "$RUNNER_TEMP/rules-baseline.md"

  ml-baseline:
    name: ML retrain + dev evaluation + baseline report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Retrained from config each run (seeded, seconds). Development splits only.
      - run: dataguard-uc4 eval run --classifier ml --split all --runs-dir "$RUNNER_TEMP/runs"
      - run: dataguard-uc4 ml report --out "$RUNNER_TEMP/ml-baseline.md"

  llm-status:
    name: LLM replay evaluation + report (no Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Replays the committed recordings (data/llm_cache): no credentials, no network. A changed
      # prompt, few-shot set or schema changes the cache key and fails here as replay_miss.
      - run: dataguard-uc4 eval run --classifier llm --llm-tier small --llm-model-id uc4-llm-small --split dev --runs-dir "$RUNNER_TEMP/runs"
      - run: dataguard-uc4 eval run --classifier llm --llm-tier mid --llm-model-id uc4-llm-medium --split dev --runs-dir "$RUNNER_TEMP/runs"
      - run: dataguard-uc4 eval run --classifier llm --llm-tier large --llm-model-id uc4-llm-large --split dev --runs-dir "$RUNNER_TEMP/runs"
      - run: dataguard-uc4 llm report --tier small=uc4-llm-small --tier mid=uc4-llm-medium --tier large=uc4-llm-large --out "$RUNNER_TEMP/llm-baseline.md"

  hybrid-report:
    name: Hybrid replay evaluation + report (no Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Dev only; every LLM response is replayed from data/llm_cache (no credentials, no network).
      - run: dataguard-uc4 eval run --classifier hybrid --hybrid-variant default --split dev --runs-dir "$RUNNER_TEMP/runs"
      - run: dataguard-uc4 hybrid report --out "$RUNNER_TEMP/hybrid-baseline.md"

  observability:
    name: Observability + failure-injection suite + privacy gate (no Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev,otel]"
      # Every row of the architecture section 19 failure matrix, end to end (local fake provider).
      - run: python -m pytest tests/failure_injection -q -p no:cacheprovider
      # Traced dev run (replayed LLM responses), then the privacy gate: exits 1 on any leaked text.
      - run: dataguard-uc4 eval run --classifier hybrid --split dev --trace-out "$RUNNER_TEMP/spans.jsonl" --runs-dir "$RUNNER_TEMP/runs"
      - run: dataguard-uc4 obs audit --spans "$RUNNER_TEMP/spans.jsonl" --split dev
      - run: dataguard-uc4 obs summarize --spans "$RUNNER_TEMP/spans.jsonl"
      - run: dataguard-uc4 obs report --out "$RUNNER_TEMP/observability-baseline.md"

  service:
    name: Service surface: frozen schema, examples, CLI (no Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Fails on ANY difference between the models and the frozen v1 schemas.
      - run: dataguard-uc4 schema check
      - run: dataguard-uc4 service info --check --llm-mode off
      - run: dataguard-uc4 classify --text "Employee record. National ID 905-37-6209." --llm-mode off --pretty
      - run: dataguard-uc4 service report --out "$RUNNER_TEMP/service-baseline.md"

  # ---------------------------------------------------------------------------------------------
  # Added in later phases (see docs/uc4 and the approved architecture plan, section 18):
  #   Real-LLM re-recording on release/dispatch, via OIDC (no long-lived secrets)
  #   Security: dependency scan, secret scanning (with fake-secret allowlist), CodeQL
  # ---------------------------------------------------------------------------------------------
