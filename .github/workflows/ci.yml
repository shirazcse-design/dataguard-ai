name: CI

on:
  push:
    branches: [main, "uc4/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint + unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests
        run: pytest

  config-validation:
    name: Validate taxonomy / high-risk / eval config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: dataguard-uc4 config validate

  dataset-validation:
    name: Regenerate + validate synthetic dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Regenerates from spec + seed and requires byte-identical output plus clean integrity checks.
      - run: dataguard-uc4 dataset validate

  harness-validation:
    name: Validate the evaluation harness (oracle / majority / random)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Exits non-zero if any of the harness self-checks fails.
      - run: dataguard-uc4 eval validate-harness --out-dir "$RUNNER_TEMP/harness-validation"

  rules-baseline:
    name: Rules Engine dev evaluation + baseline report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Development splits only: the locked test split is refused without --allow-locked-test.
      - run: dataguard-uc4 eval run --classifier rules --split all --runs-dir "$RUNNER_TEMP/runs"
      - run: dataguard-uc4 rules report --out "$RUNNER_TEMP/rules-baseline.md"

  ml-baseline:
    name: ML retrain + dev evaluation + baseline report
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # Retrained from config each run (seeded, seconds). Development splits only.
      - run: dataguard-uc4 eval run --classifier ml --split all --runs-dir "$RUNNER_TEMP/runs"
      - run: dataguard-uc4 ml report --out "$RUNNER_TEMP/ml-baseline.md"

  llm-status:
    name: LLM status report (mock/replay only, no Azure)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # No credentials and no network: reports NOT RUN for any tier without a recorded cache.
      - run: dataguard-uc4 llm report --out "$RUNNER_TEMP/llm-baseline.md"
      - run: dataguard-uc4 eval run --classifier llm --split dev --llm-model-id none --llm-cache-dir "$RUNNER_TEMP/empty-cache" --runs-dir "$RUNNER_TEMP/runs"

  # ---------------------------------------------------------------------------------------------
  # Added in later phases (see docs/uc4 and the approved architecture plan, section 18):
  #   Phase 5: full LLM + hybrid eval on release/dispatch, via OIDC (no long-lived secrets)
  #   Security: dependency scan, secret scanning (with fake-secret allowlist), CodeQL
  # ---------------------------------------------------------------------------------------------
