# Observability configuration (architecture section 14; PRD 16.1, 19).
#
# PRIVACY IS DENY-BY-DEFAULT: a span or event attribute is exported only if its key is listed in
# `allowed_attributes`. Never list a key that can carry document text. Values are additionally
# truncated and masked by the redactor as defence in depth. Exception MESSAGES are never recorded,
# only the exception class name.
observability_version: 1.0.0
service_name: dataguard-uc4
max_value_chars: 120
pseudonym_salt_env: DATAGUARD_OBS_SALT     # unset: a per-process random salt (pseudonyms are then not stable)
azure_monitor:
  # The connection string itself is never written here: only the env var NAME that holds it at
  # runtime (see `dataguard-uc4 obs azure-check`). Never commit a real connection string.
  connection_string_env: DATAGUARD_AZURE_MONITOR_CONNECTION_STRING
allowed_attributes:
  # request
  - dg.request_id
  - dg.document_id
  - dg.caller
  - dg.content_hash
  - dg.content_bytes
  - dg.extension
  - dg.classifier
  - dg.classifier_version
  - dg.variant
  # stage / routing
  - dg.stage
  - dg.reason
  - dg.stop_reason
  - dg.escalations
  - dg.short_circuited
  - dg.stages_run
  - dg.notes_count
  - dg.latency_ms
  - dg.tokens_in
  - dg.tokens_out
  - dg.est_cost_usd
  - dg.failed_stages
  # model
  - dg.llm.tier
  - dg.llm.model_id
  - dg.llm.served_model
  - dg.llm.prompt_version
  - dg.llm.attempts
  - dg.llm.repair_attempts
  - dg.llm.cached
  - dg.llm.status
  - dg.llm.error_kind
  - dg.llm.schema_invalid
  - dg.llm.invalid_reason
  - dg.llm.evidence_total
  - dg.llm.evidence_verified
  - dg.llm.truncated
  - dg.llm.retry_kind
  # guardrail
  - dg.guardrail.type
  - dg.guardrail.trigger
  - dg.guardrail.action
  - dg.input.reason
  - dg.injection.flagged
  # outcome
  - dg.outcome.status
  - dg.outcome.level
  - dg.outcome.level_decided_by
  - dg.outcome.level_confidence_kind
  - dg.outcome.n_categories
  - dg.outcome.categories
  - dg.outcome.high_risk
  - dg.outcome.review_required
  - dg.outcome.review_reasons
  - dg.outcome.provisional
  - dg.outcome.warnings_count
  # Batch Triage Agent (fixed-vocabulary values only: allow-listed tool names, error kinds, loop
  # stop/review reasons; never tool arguments, tool results, rationale or free-text review reasons)
  - dg.agent.name
  - dg.agent.config_version
  - dg.agent.planner
  - dg.agent.step
  - dg.agent.turn
  - dg.agent.n_tool_calls
  - dg.agent.tool
  - dg.agent.tool_ok
  - dg.agent.tool_error
  - dg.agent.args_rebound
  - dg.agent.tool_calls
  - dg.agent.stopped_reason
  - dg.agent.priority
  - dg.agent.review_requested
  - dg.agent.review_reason
  # Data Security Policy Copilot (UC6; docs/uc6/observability.md). Ids, counts, statuses, fixed
  # vocabularies and policy/section identifiers only: never the question, search queries, policy
  # text, quotes or claim text.
  - dg.policy.level
  - dg.policy.mode
  - dg.policy.status
  - dg.policy.guard_ok
  - dg.policy.n_hits
  - dg.policy.dense_status
  - dg.policy.stages
  - dg.policy.claims
  - dg.policy.claims_unverified
  - dg.policy.fabricated_citations
  - dg.policy.n_claims
  - dg.policy.n_dropped
  - dg.policy.drop_reasons
  - dg.policy.cited
  - dg.policy.evidence_status
  - dg.policy.n_conflicts
  - dg.policy.n_evidence
  # UC1 Agentic DLP (docs/uc1/observability.md). Fixed vocabularies and numbers only: a
  # schema-validated case id, outcome/band/risk enums, rubric reason codes, simulated-fault names,
  # destination class (never the host), counts. Never a user id, host, filename or document text.
  - dg.dlp.case_id
  - dg.dlp.outcome
  - dg.dlp.band
  - dg.dlp.score
  - dg.dlp.risk_level
  - dg.dlp.reason_codes
  - dg.dlp.simulated_faults
  - dg.dlp.destination_class
  - dg.dlp.behavior_band
  - dg.dlp.n_signals
  - dg.dlp.n_findings
  - dg.dlp.policy_effect
  # UC2 Insider Risk (docs/uc2/observability.md). Codes, scores and counts only: a schema case id,
  # a PSEUDONYMOUS subject (salted hash, never the user id), the authoritative anomaly score/band
  # and model version, role family and privilege (access context, not HR), UC4 max level, UC6
  # topic/status/effect, delegation and outcome codes. Never raw logs, document or policy text,
  # agent reasoning, justifications, names or repository names.
  - dg.ir.case_id
  - dg.ir.subject
  - dg.ir.architecture
  - dg.ir.trigger
  - dg.ir.anomaly_score
  - dg.ir.anomaly_band
  - dg.ir.model_version
  - dg.ir.n_signals
  - dg.ir.role_family
  - dg.ir.privilege
  - dg.ir.n_files
  - dg.ir.max_level
  - dg.ir.data_uncertain
  - dg.ir.policy_topic
  - dg.ir.policy_status
  - dg.ir.policy_effect
  - dg.ir.policy_conflict
  - dg.ir.policy_n_claims
  - dg.ir.score
  - dg.ir.band
  - dg.ir.floor
  - dg.ir.outcome
  - dg.ir.reason_codes
  - dg.ir.analyst_review_required
  - dg.ir.agents_run
  - dg.ir.delegations
  - dg.ir.early_stop
  - dg.ir.simulated_faults
  # errors (class name only)
  - dg.error.type
