# UC4 synthetic dataset specification.  [approved: ~800 docs, ~200 in the locked test set]
#
# The dataset is a pure function of this spec, pools.yaml, families/*.yaml and the seed:
# `dataguard-uc4 dataset generate` regenerates it byte-for-byte, and CI verifies that.

dataset_id: dataguard-uc4-synthetic
dataset_version: 1.0.0
generator_name: template-v1
generator_version: 1.0.0
seed: 20260918
taxonomy_version: 1.0.0

# How much the gold labels can be trusted. This string is copied into the dataset manifest, every
# dataset report and every evaluation run manifest/report. Change it ONLY after a human reviewer has
# signed off (and then also change annotation_status of the reviewed documents).
label_status: "AI-generated synthetic dataset — pending human gold-label review"

target_total_docs: 800
split_fractions:
  train: 0.50
  calibration: 0.125
  dev: 0.125
  test: 0.25

# Minimum gold positives per label (level or category) per split. Shortfalls are recorded as
# small-sample flags in the manifest (reported, not fatal), except that the TEST split must have
# at least one positive for every label and at least one document of every tier.
min_positives_per_label:
  train: 40
  calibration: 8
  dev: 8
  test: 25

near_duplicate:
  shingle_size: 5
  cross_split_max_jaccard: 0.5

split_search:
  restarts: 30
  iterations: 3000

tier_descriptions:
  T1: Easy. Sensitivity signalled by explicit patterns or markers.
  T2: Semantic. Sensitivity carried by meaning; no obvious identifiers (lint-enforced).
  T3: Ambiguous. A careful reviewer could disagree; gold follows the fail-safe tie-break.
  T4: Hard negative. Resembles a higher-sensitivity class but is not (decoy_for lists what).
  T5: Adversarial. Contains prompt-injection text; gold is set by the real content.
