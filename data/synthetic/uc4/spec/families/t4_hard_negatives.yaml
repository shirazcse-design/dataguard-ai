  - family_id: hn_notes_mentioning_confidentiality
    description: Meeting notes that discuss confidentiality and NDA process in general terms.
    tier: T4
    format: meeting_notes
    gold_level: INTERNAL
    decoy_for: [MA_CORP_STRATEGY]
    n_docs: 5
    filenames: ["Legal_Training_Notes.docx", "NDA_Process_Overview.docx"]
    metadata: {source_system: "Confluence", author_department: "Legal"}
    notes: Talks about acquisitions and confidentiality as a process; describes no actual deal.
    bodies:
      - |
        Legal training notes - handling confidential deal information

        Reminder for anyone who may work on acquisitions, mergers or investments in future: sign an NDA before receiving any non-public material, use the deal room rather than email, and never discuss rumours about deals at conferences. If you are unsure whether something is confidential, ask Legal first. Session run by «person» on «@date», attended by «@int:8-60» staff.
      - |
        NDA process - quick guide for employees

        Before sharing any non-public information with an outside party, check whether an NDA is in place. Requests go through the Legal intake form and normally take «@int:2-5» working days. Do not sign an NDA yourself, and remember that confidentiality duties continue after a project ends. This guide is general and does not refer to any specific transaction.
      - |
        Onboarding session: working with sensitive information

        The session covered how to label documents, when to use the deal room, and why speculating about mergers or acquisitions in public is discouraged. «person» from Legal answered questions about insider-trading rules. Slides are on the intranet.
