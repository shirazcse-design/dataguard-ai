# T4 (hard negative) families: content that resembles a higher-sensitivity class but is NOT.
# `decoy_for` lists what each family resembles; the gold label must not contain any of it.
families:
  - family_id: hn_awareness_doc_explains_ssn
    description: Security awareness guidance that shows what an SSN looks like using dummy and masked values.
    tier: T4
    format: policy_doc
    gold_level: INTERNAL
    decoy_for: [PII]
    n_docs: 5
    filenames: ["Security_Awareness_PII_Basics.docx", "Data_Handling_Training_«@year».pdf"]
    metadata: {source_system: "Intranet", author_department: "Security"}
    notes: Teaches employees to recognise SSNs using the canonical dummy value and masked examples; no real person is identified.
    bodies:
      - |
        Recognising personal identifiers - awareness training

        A US Social Security number has nine digits in the pattern 3-2-4, for example 123-45-6789 (a placeholder, not a real number). When you must reference one in a ticket, mask it: «@ssn_masked».

        Rules of thumb:
        - Never paste a full number into chat or email.
        - Store identifiers only in approved systems.
        - Report accidental exposure to the security team within one business day.
  - family_id: hn_test_card_numbers_doc
    description: Internal QA doc listing the payment processor's public test card numbers.
    tier: T4
    format: how_to
    gold_level: INTERNAL
    decoy_for: [FINANCIAL_PCI]
    n_docs: 5
    filenames: ["Payments_Testing_Guide.md", "QA_Test_Cards.txt", "Sandbox_Test_Data_«@year».docx"]
    metadata: {source_system: "Confluence", author_department: "Engineering"}
    notes: These are the public, documented test PANs that never move real money.
    bodies:
      - |
        Payments sandbox - test cards

        Use these published test numbers in the sandbox only. They are not real cards and never move funds.
        Visa test: 4111 1111 1111 1111
        Mastercard test: 5555 5555 5555 4444
        Amex test: 3782 822463 10005
        Any future expiry date and any three-digit code will work. Declined-payment scenarios are listed on the vendor's public test page. Guide maintained by «person» («dept»), updated «@date».
      - |
        QA notes for the «codeword» checkout - «@date»

        When testing the «product_noun» store, pay with the processor's documented sandbox cards, for example 4242 4242 4242 4242 (approve) or 4000 0000 0000 0002 (decline). These come from the vendor's public docs and cannot charge anyone.
        Owner: «person». Sandbox only; never use a real card in test environments.
      - |
        How to test payment failures

        The gateway publishes a list of test numbers. Visa 4111111111111111 succeeds; use the decline number from the public sandbox page to trigger an error and check that our retry screen appears. Every number in the list is a well-known test value.
        Last reviewed «month» «@year» by «person».
  - family_id: hn_open_source_code
    description: Open-source code released under the MIT licence.
    tier: T4
    format: source_code
    gold_level: PUBLIC
    decoy_for: [SOURCE_CODE]
    n_docs: 5
    filenames: ["utils.py", "slugify.js", "retry.go", "LICENSE_and_helpers.py"]
    metadata: {source_system: "Public repository", source_path: "/oss/«codeword»/"}
    notes: Publicly licensed open-source code is not Source Code under this policy.
    bodies:
      - |
        # MIT License - Copyright (c) «@year» «company» contributors
        # Permission is hereby granted, free of charge, to any person obtaining a copy of this software
        # and associated documentation files, to deal in the Software without restriction.

        def slugify(text):
            out = []
            for ch in text.lower():
                out.append(ch if ch.isalnum() else "-")
            return "-".join(part for part in "".join(out).split("-") if part)

        def chunk(items, size):
            for i in range(0, len(items), size):
                yield items[i : i + size]
      - |
        /* MIT License - Copyright (c) «@year» «company» contributors. Published on the public package registry. */
        function retry(fn, attempts = 3) {
          return async (...args) => {
            let lastError;
            for (let i = 0; i < attempts; i++) {
              try { return await fn(...args); } catch (e) { lastError = e; }
            }
            throw lastError;
          };
        }
  - family_id: hn_code_reads_env_secrets
    description: Proprietary code that reads its credentials from the environment (no secret present).
    tier: T4
    format: source_code
    gold_level: CONFIDENTIAL
    gold_categories: [SOURCE_CODE]
    decoy_for: [CREDENTIALS_SECRETS]
    n_docs: 5
    filenames: ["db_client.py", "settings.py", "payments_gateway.py"]
    metadata: {source_system: "Git repository", source_path: "/src/«codeword»/"}
    notes: Mentions passwords and keys, but only reads them from environment variables; no secret value is present.
    bodies:
      - |
        # Copyright «@year» «company». Internal.
        import os

        ⟦SOURCE_CODE§def get_connection():
            host = os.environ["DB_HOST"]
            user = os.environ["DB_USER"]
            password = os.environ["DB_PASSWORD"]  # injected by the secret manager at runtime
            return connect(host=host, user=user, password=password)⟧
      - |
        // Internal - «company»
        ⟦SOURCE_CODE§const apiKey = process.env.PAYMENTS_API_KEY;
        if (!apiKey) {
          throw new Error("PAYMENTS_API_KEY is not set");
        }
        const client = new PaymentsClient({ apiKey });⟧
