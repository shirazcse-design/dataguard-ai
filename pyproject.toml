[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataguard-ai"
version = "0.1.0"
description = "DataGuard AI: Agentic Data Security & Insider Risk platform (Sensitive Data Discovery & Classification Agent)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "jsonschema>=4.20",  # validates examples against the FROZEN JSON Schemas, as a consumer would
]
# Optional export bridge to the OpenTelemetry SDK (tested with its in-memory exporter).
otel = [
    "opentelemetry-api>=1.24",
    "opentelemetry-sdk>=1.24",
]
# Azure Monitor export (`dataguard-uc4 obs azure-check`); verified 2026-09-21 against a real
# Application Insights resource. Needs a connection string in the environment; never a config file.
azure-monitor = [
    "azure-monitor-opentelemetry>=1.6",
]

# The Batch Triage Agent in Foundry Agent Service (`agent foundry-register`, `--agent-mode
# foundry-service`). Entra ID sign-in only; imported lazily, never by a unit test.
foundry-agents = [
    "azure-ai-projects>=2.0",
    "azure-identity>=1.17",
    "openai>=1.60",
]

# The MCP server for `classify_document` (docs/uc4/mcp-contract.md). The adapter core does not
# import the SDK; only `mcp_adapter/server.py` does.
mcp = [
    "mcp>=2.0",
]

[project.scripts]
dataguard-uc4 = "app.classification.cli:main"
dataguard-uc4-mcp = "mcp_adapter.server:main"
dataguard-policy = "app.policy.cli:main"
dataguard-dlp = "app.dlp.cli:main"
dataguard-insider = "app.insider.cli:main"
dataguard-access = "app.access.cli:main"
dataguard-incident = "app.incident.cli:main"

[tool.setuptools.package-data]
"app.demo" = ["static/*"]

[tool.setuptools.packages.find]
include = ["app*", "rules*", "ml*", "evals*", "guardrails*", "observability*", "mcp_adapter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures are hand-formatted tables; long lines there aid readability.
"tests/**" = ["E501"]
# The validation report is prose-heavy generated text; wrapping it would hurt readability.
"evals/classification/validation.py" = ["E501"]
"evals/classification/reporting.py" = ["E501"]
"evals/classification/rules_report.py" = ["E501"]
"evals/classification/ml_report.py" = ["E501"]
"evals/classification/llm_report.py" = ["E501"]
"evals/classification/hybrid_report.py" = ["E501"]
"evals/classification/obs_report.py" = ["E501"]
"evals/classification/failure_matrix.py" = ["E501"]
"evals/classification/schema_examples.py" = ["E501"]
"evals/classification/service_report.py" = ["E501"]
"evals/classification/gold_review.py" = ["E501"]
"evals/policy/report.py" = ["E501"]
"evals/policy/guardrails_verify.py" = ["E501"]
"evals/policy/foundry_evals.py" = ["E501"]
"evals/dlp/metrics.py" = ["E501"]
"evals/dlp/report.py" = ["E501"]
"ml/insider/synth.py" = ["E501"]                  # UC2 scenario and role-family data tables
"evals/insider/golden_build.py" = ["E501"]        # UC2 golden case table
"evals/insider/ml_eval.py" = ["E501"]             # UC2 ML report tables
"evals/insider/agent_eval.py" = ["E501"]          # UC2 investigation metrics
"evals/insider/observability_report.py" = ["E501"] # UC2 telemetry report
"evals/insider/guardrails_verify.py" = ["E501"]   # UC2 probe table
"evals/insider/foundry_evals.py" = ["E501"]       # UC2 Foundry eval rows
"evals/insider/learning_loop.py" = ["E501"]       # UC2 learning-loop report
"app/agent/bounded.py" = ["E501"]                  # moved from app/insider/agents.py unchanged
"evals/access/*.py" = ["E501"]                     # UC3 golden table and report rows
"app/access/*.py" = ["E501"]                       # UC3 data tables and typed records
"app/incident/*.py" = ["E501"]                     # UC5 data tables, typed records and evidence builders
"evals/incident/*.py" = ["E501"]                   # UC5 golden table, probes and report rows
"app/demo/access.py" = ["E501"]                   # UC3 demo case table
"app/demo/insider.py" = ["E501"]                  # UC2 demo case table
"app/insider/services.py" = ["E501"]             # UC2 capability payload builders
"app/insider/agents.py" = ["E501"]               # UC2 agent loop (span attribute lines)
"app/insider/case.py" = ["E501"]                 # UC2 tool descriptions
"app/insider/harness.py" = ["E501"]              # UC2 summary templates
"app/insider/pipeline.py" = ["E501"]             # UC2 architectures and offline scripts
"app/insider/service.py" = ["E501"]              # UC2 client wiring
"app/insider/mcp_tools.py" = ["E501"]            # UC2 MCP tool descriptions
"app/insider/cli.py" = ["E501"]                  # UC2 report renderers
"evals/classification/blind_review.py" = ["E501"]
"evals/classification/blind_compare.py" = ["E501"]
"evals/classification/blind_compare_round2.py" = ["E501"]
# Inline CSS and HTML templates.
"observability/dashboard.py" = ["E501"]
